name: Align initial release source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align the initial empty release with its final source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          old="$(git rev-parse refs/tags/v0.1.0)"
          # Only the known initial placeholder tag may be advanced.
          test "$old" = "47b50d84ffb313455ec6039c0d381bf0d702983b"
          git tag -f v0.1.0 "$GITHUB_SHA"
          git push --force-with-lease=refs/tags/v0.1.0:"$old" origin refs/tags/v0.1.0

