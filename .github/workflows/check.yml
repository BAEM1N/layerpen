name: Desktop checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: node --test tests/*.test.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: layerpen-${{ matrix.os }}
          path: |
            src-tauri/target/release/monitor-ink
            src-tauri/target/release/monitor-ink.exe

