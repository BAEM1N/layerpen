[package]
name = "pointory"
version = "0.1.0"
edition = "2021"
description = "Pointory: screen annotation for meetings, demos, and teaching"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
xcap = "0.9"
base64 = "0.22"
gif = "0.13"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

fontdb = "0.24"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
validation = ["tauri/dynamic-acl"]
