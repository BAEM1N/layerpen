[package]
name = "monitor-ink"
version = "0.1.0"
edition = "2021"
description = "LayerPen: screen annotation for meetings, demos, and teaching"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
xcap = "0.9"
base64 = "0.22"
gif = "0.13"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
